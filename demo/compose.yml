name: lynx-note-demo
services:
  web:
    build:
      context: ..
      dockerfile: demo/Dockerfile
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      MONGODB_URI: mongodb://mongo:27017/lynx_note_demo
    depends_on:
      mongo:
        condition: service_healthy
  mongo:
    image: mongo:7.0
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
